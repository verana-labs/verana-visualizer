replicaCount: 1

image:
  repository: veranalabs/verana-visualizer
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts: []
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: "production"
  NEXT_PUBLIC_VERANA_INDEXER_BASE_URL: ""
  NEXT_PUBLIC_VERANA_RPC_ENDPOINT: ""
  NEXT_PUBLIC_VERANA_REST_ENDPOINT: ""
  NEXT_PUBLIC_VERANA_CHAIN_ID: ""
  NEXT_PUBLIC_VERANA_CHAIN_NAME: ""
  NEXT_PUBLIC_VERANA_GRAPH_URL: ""
  NEXT_PUBLIC_VERANA_FRONTEND_URL: ""
  NEXT_PUBLIC_VERANA_PEER_VISUALIZER_URL: ""
