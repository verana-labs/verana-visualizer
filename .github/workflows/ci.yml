name: Continuous Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: 2060-io/organization/.github/workflows/2060-linter-call.yml@main
    with:
      enable-charts-lint: true
      charts-dir: charts

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_VERANA_INDEXER_BASE_URL: https://idx.testnet.verana.network
      NEXT_PUBLIC_VERANA_RPC_ENDPOINT: https://rpc.testnet.verana.network
      NEXT_PUBLIC_VERANA_REST_ENDPOINT: https://api.testnet.verana.network
      NEXT_PUBLIC_VERANA_CHAIN_ID: vna-testnet-1
      NEXT_PUBLIC_VERANA_CHAIN_NAME: testnet
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format
        run: pnpm check-format

      - name: Check types
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Docker build
        run: docker build --build-arg APP_VERSION=0.0.0-ci .
